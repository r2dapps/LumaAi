function memoryCandidateFromText(text){const t=String(text||'').trim();const rules=[{re:/\bmy name is\s+(.+?)(?:[.!?]|$)/i,type:'PROFILE',importance:.9},{re:/\bi work (?:as|at)\s+(.+?)(?:[.!?]|$)/i,type:'PROFILE',importance:.8},{re:/\bi (?:really )?(?:like|love)\s+(.+?)(?:[.!?]|$)/i,type:'PREFERENCE',importance:.7},{re:/\bi hate\s+(.+?)(?:[.!?]|$)/i,type:'PREFERENCE',importance:.8},{re:/\bi(?:'| a)m working on\s+(.+?)(?:[.!?]|$)/i,type:'GOAL',importance:.8},{re:/\bi want to\s+(.+?)(?:[.!?]|$)/i,type:'GOAL',importance:.7}];for(const r of rules){const m=t.match(r.re);if(m&&m[1]&&m[1].length<160){const v=m[0].trim();if(!(S.comp.memories||[]).some(x=>x.text.toLowerCase()===v.toLowerCase()))return normalizeMemory({text:v,source:'conversation',type:r.type,importance:r.importance,confidence:.86,tags:[r.type.toLowerCase()]})}}return null}

function highlightCode(code,lang='code'){

    x=x.replace(/([.#]?[a-zA-Z_-][\w-]*)(?=\s*\{)/g,`<span class="tok-key">$1</span>`);

function latexSimpleHTML(src){

  S.modelCacheMeta[id]={...(S.modelCacheMeta[id]||{}),status:'verified',downloadedAt:S.modelCacheMeta[id]?.downloadedAt||Date.now(),lastVerifiedAt:Date.now(),verification:note};
  save();
}
async function cacheState(id){
  try{const w=await importWebLLM();return !!(await w.hasModelInCache(id))}catch{return null}
}
async function verifyOneModel(id){
  const result=await probeCacheArtifacts(id);
  if(result.status==='verified'){markModelVerified(id,'Model weights, chat config and WebGPU runtime are present in browser cache');return result}
  if(result.status==='partial'){
    S.cacheStates[id]=false;
    if(S.modelCacheMeta[id]) S.modelCacheMeta[id]={...S.modelCacheMeta[id],status:'downloaded',lastVerifiedAt:Date.now(),verification:`Partial cache: weights=${result.weights?'yes':'no'}, config=${result.config?'yes':'no'}, runtime=${result.wasm?'yes':'no'}`};
    save();return result;
  }
  if(result.status==='missing'){
    S.cacheStates[id]=false;
    if(S.modelCacheMeta[id]) S.modelCacheMeta[id]={...S.modelCacheMeta[id],status:'downloaded',lastVerifiedAt:Date.now(),verification:'Cache probe did not confirm the model artifacts'};
    save();return result;
  }
  return result;
}
async function refreshCacheStates(opts={}){
  const forceAll=!!opts.forceAll;
  const ids=(forceAll?MODELS.map(m=>m.id):MODELS.filter(m=>isModelDownloaded(m.id)).map(m=>m.id));
  let resolved=false;
  for(const id of ids){try{const r=await verifyOneModel(id);if(r&&r.status&&r.status!=='unknown')resolved=true}catch{}}
  if(resolved||!ids.length)S.cacheRecoveryPending=false;
  save();
  if(document.querySelector('[data-pane="model"]')){
    const pane=document.querySelector('[data-pane="model"]');const wasScroll=pane?.scrollTop||0;const tab='model';
    $('settingsSheet').innerHTML=settingsHTML(tab);bindSettings();renderModelProgress();renderInstallState();
    const np=document.querySelector('[data-pane="model"]');if(np)np.scrollTop=wasScroll;
  }
}
function formatBytes(bytes){const n=Number(bytes)||0;if(n<1024)return `${n} B`;const kb=n/1024;if(kb<1024)return `${kb.toFixed(0)} KB`;const mb=kb/1024;if(mb<1024)return `${mb.toFixed(1)} MB`;return `${(mb/1024).toFixed(2)} GB`}
function localAppBytes(){try{return new Blob([localStorage.getItem('luma_companion_v5')||'']).size}catch{return 0}}
async function knownWebLLMCacheStats(){
 let bytes=0,entries=0;
 if(!('caches' in window))return {bytes:0,entries:0,exact:false};
 try{
  const names=(await caches.keys()).filter(k=>/webllm|mlc/i.test(k));
  for(const name of names){const cache=await caches.open(name);const responses=await cache.matchAll();entries+=responses.length;for(const r of responses){const n=Number(r.headers.get('content-length'));if(Number.isFinite(n)&&n>0)bytes+=n}}

 }catch{return {bytes:0,entries:0,exact:false}}
}
async function getStorageStats(){

 const details=usage.usageDetails&&typeof usage.usageDetails==='object'?Object.entries(usage.usageDetails).filter(([,v])=>Number(v)>0).sort((a,b)=>Number(b[1])-Number(a[1])).slice(0,8):[];
 const downloaded=MODELS.filter(m=>isModelDownloaded(m.id));return {used,quota,app,modelCache,details,localModels:downloaded.length,conversations:S.chats.length,messages:S.chats.reduce((n,c)=>n+(c.messages?.length||0),0),memories:(S.comp.memories||[]).length};
}

async function deleteDownloadedModel(id){
 if(S.loading)return;
 const model=modelRecord(id);if(!model)return;
 const wasLoaded=S.loadedModel===id;
 if(!confirm(`Delete the downloaded files for “${model.label}”? You can download it again later.`))return;
 S.loading=true;S.loadingKind='model';setModelProgress(true,'Deleting model…','Removing the model, tokenizer, WASM and chat-config cache entries.',null,false,false);renderSendState();
 try{
  if(wasLoaded)await unloadEngine();
  const w=await importWebLLM();
  if(w.deleteModelAllInfoInCache)await w.deleteModelAllInfoInCache(id);
  else if(w.deleteModelInCache)await w.deleteModelInCache(id);
  S.cacheStates[id]=false;delete S.modelCacheMeta[id];
  if(S.model===id){const replacement=MODELS.find(m=>isModelDownloaded(m.id));S.model=replacement?.id||deviceModel(S.device||{})?.id||MODELS[0]?.id}
  S.modelDownload={active:false,id:null,progress:null,label:'',note:'',error:false,done:false,startedAt:null};
  localStorage.removeItem('luma_model_ready');save();setStatus('Model deleted');
 }catch(e){setModelProgress(false,'Delete failed',e?.message||'Could not delete the downloaded model.',null,true,false);setStatus('Model delete failed')}
 finally{S.loading=false;S.loadingKind='idle';renderSendState();if(document.querySelector('[data-pane="model"]'))await refreshCacheStates({forceAll:false})}
}
async function clearWebLLMCache(){

  await unloadEngine();const w=await importWebLLM();

function browserOnline(){return navigator.onLine!==false}
function modelRecord(id){return MODELS.find(m=>m.id===id)||null}

function responseTokenBudget(){const limit=modelContextLimit(S.model);const desired=Math.min(Number(S.generation.maxTokens)||512,1024);const cap=Math.max(128,Math.floor(limit*.4));return Math.min(desired,cap)}
function estimateTokens(text){return Math.max(1,Math.ceil(String(text||'').length/4))}
function apiMessage(m){if(m.role==='user'&&m.image){return {role:'user',content:[{type:'text',text:m.content||'Please inspect this image.'},{type:'image_url',image_url:{url:m.image}}]}}return {role:m.role,content:m.content||''}}
function buildContextMessages(c, beforeIndex=c.messages.length-1){const system={role:'system',content:systemPrompt()};const maxCtx=Math.min(modelContextLimit(S.model),Math.max(1024,Number(S.generation.contextWindow)||4096));const reserve=responseTokenBudget()+160;let budget=Math.max(128,maxCtx-reserve-estimateTokens(system.content));const out=[];for(let i=Math.min(beforeIndex,c.messages.length-1);i>=0;i--){const m=c.messages[i];const cost=estimateTokens(typeof m.content==='string'?m.content:'')+(m.image?350:0);if(cost>budget){if(out.length===0){const clipped={...m,content:(m.content||'').slice(-Math.max(160,budget*4))};out.unshift(apiMessage(clipped));}break}out.unshift(apiMessage(m));budget-=cost}return [system,...out]}

function openSetup(){const m=deviceModel(S.device||{})||MODELS[0];const mc=modelCompatibility(m,S.device||{});const c=S.comp;$('setupCard').innerHTML=`<h2>Welcome to Luma</h2><p>A private AI companion that runs locally in your browser. Set up how you want to be addressed first. The next step opens <b>Settings → Model</b> so you can explicitly choose and download the local AI model.</p><label class="field-label">Your name</label><input class="field" id="setupUserName" value="${esc(c.userName)}" placeholder="Your name"><div class="row2"><div><label class="field-label">Your gender</label><select class="field" id="setupUserGender"><option>Prefer not to say</option><option ${c.userGender==='Female'?'selected':''}>Female</option><option ${c.userGender==='Male'?'selected':''}>Male</option><option ${c.userGender==='Non-binary'?'selected':''}>Non-binary</option></select></div><div><label class="field-label">Pronouns</label><select class="field" id="setupPronouns"><option ${c.pronouns==='she/her'?'selected':''}>she/her</option><option ${c.pronouns==='he/him'?'selected':''}>he/him</option><option ${c.pronouns==='they/them'?'selected':''}>they/them</option></select></div></div><label class="field-label">What should I call you?</label><div class="row2"><input class="field" id="setupNickname" value="${esc(c.nickname)}" placeholder="Nickname (optional)"><select class="field" id="setupAddress"><option value="name" ${c.addressMode==='name'?'selected':''}>Use my name</option><option value="nickname" ${c.addressMode==='nickname'?'selected':''}>Use my nickname</option><option value="none" ${c.addressMode==='none'?'selected':''}>Don't use a name</option></select></div><div class="section-divider"></div><div class="setup-model"><strong>${esc(m.label)}</strong><span>${esc(m.desc)} · ${mc.status==='compatible'?'recommended for this device':mc.status==='possible'?'possible, with less headroom':'not recommended on this device'}${S.modelBench?.ms?` · GPU test ${S.modelBench.ms.toFixed(0)} ms`:''}</span></div><p>${navigator.gpu?'WebGPU is available. Continue to Model settings to download the model explicitly.':'WebGPU is not available in this browser, so local model inference cannot start yet.'}</p><div class="setup-actions"><button class="setup-secondary" id="setupLater">Later</button><button class="setup-primary" id="setupContinue" ${navigator.gpu?'':'disabled'}>Continue to Model Settings</button></div>`;$('setupBackdrop').classList.add('show');$('setupLater').onclick=()=>$('setupBackdrop').classList.remove('show');$('setupContinue').onclick=()=>{c.userName=$('setupUserName').value.trim();c.userGender=$('setupUserGender').value;c.pronouns=$('setupPronouns').value;c.nickname=$('setupNickname').value.trim();c.addressMode=$('setupAddress').value;S.setupComplete=true;save();$('setupBackdrop').classList.remove('show');openSettings('model')}}
function addMemoryObject(obj){const n=normalizeMemory(obj);if(!n.text)return false;const c=S.comp;c.memories=c.memories||[];const existing=c.memories.find(m=>m.text.toLowerCase()===n.text.toLowerCase());if(existing){existing.importance=Math.max(Number(existing.importance)||0,n.importance);existing.confidence=Math.max(Number(existing.confidence)||0,n.confidence);existing.updated=Date.now();save();return false}c.memories.push(n);c.memories=c.memories.sort((a,b)=>(Number(b.importance)||0)-(Number(a.importance)||0)).slice(0,80);save();return true}
function addMemory(text,source='user',type='FACT',importance=.6,confidence=1){const v=String(text||'').trim();if(v)addMemoryObject({text:v,source,type,importance,confidence})}
function autoRemember(text){setMemoryCandidate(text)}
function rememberMessage(i){const c=current(),m=c?.messages[i];if(!m||m.role!=='user')return;addMemory(m.content,'conversation','FACT',.7,1);S.memoryCandidate=null;renderMessages()}
function editMemory(id){const m=(S.comp.memories||[]).find(x=>x.id===id);if(!m)return;const v=prompt('Edit memory',m.text);if(v!=null&&v.trim()){m.text=v.trim();m.updated=Date.now();save();openSettings('memory')}}
function forgetMemory(id){S.comp.memories=(S.comp.memories||[]).filter(m=>m.id!==id);save();openSettings('memory')}

function modelMetaHtml(m,cc){
 const context=Number(m?.contextWindow||4096),vram=m?.vram?`~${(m.vram/1024).toFixed(1)} GB`: 'Not reported';

 const features=m?.features?.length?m.features.join(', '):'No special WebGPU features listed';
 return `<div class="compat-line"><i class="compat-dot ${cc?.status==='compatible'?'good':''}"></i><span><b>${esc((cc?.status||'unknown').toUpperCase())}</b> · ${esc(cc?.reason||'No compatibility data')}</span></div><div class="limit-grid"><div class="limit-card"><b>${esc(vram)}</b><span>Estimated GPU memory</span></div><div class="limit-card"><b>${context} tokens</b><span>Model context limit</span></div><div class="limit-card"><b>${m?.low?'Yes':'No'}</b><span>Low-resource flag</span></div><div class="limit-card"><b>${esc(modelType)}</b><span>Model type${/VLM/i.test(modelType)?' · image input':''}</span></div></div><p class="data-note" style="margin:8px 0 0">Required WebGPU features: ${esc(features)}.</p>`;
}

 if(window.matchMedia?.('(display-mode: standalone)').matches||navigator.standalone===true)return 'Installed — running as an app';

let deferredInstallPrompt=null;

async function installLuma(){
 if(window.matchMedia?.('(display-mode: standalone)').matches||navigator.standalone===true)return;

}

 window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;window.__lumaInstallPrompt=false;const b=$('pwaBanner');if(b)b.hidden=true;renderInstallState();setStatus('Luma installed')});

}

let recognition=null;let recognizing=false;function speechCtor(){return window.SpeechRecognition||window.webkitSpeechRecognition||null}
async function startVoice(){
 const C=speechCtor();if(!C){alert('Voice input is not supported by this browser. Try current Chrome or Edge.');return}
 if(recognizing){try{recognition.stop()}catch{}return}
 recognition=new C();recognition.lang='en-IN';recognition.interimResults=true;recognition.continuous=false;recognition.maxAlternatives=1;
 if('processLocally' in recognition)recognition.processLocally=true;
 recognition.onstart=()=>{recognizing=true;$('micBtn').classList.add('mic','active');setStatus('Listening…')};
 recognition.onresult=e=>{let text='';for(let i=e.resultIndex;i<e.results.length;i++)text+=e.results[i][0].transcript;if(text){$('input').value=text;resize()}};
 recognition.onerror=e=>{if(e.error==='language-not-supported'||e.error==='service-not-allowed'){try{recognition.processLocally=false;recognition.start();return}catch{}}if(e.error!=='aborted')alert('Voice input: '+e.error)};
 recognition.onend=()=>{recognizing=false;$('micBtn').classList.remove('active');setStatus(navigator.gpu?'Local AI ready':'WebGPU unavailable',!!navigator.gpu)};
 try{
   if(C.available&&'processLocally' in recognition){const state=await C.available({langs:['en-IN'],processLocally:true,quality:'dictation'}).catch(()=>null);if(state==='downloadable'&&C.install)await C.install({langs:['en-IN'],processLocally:true,quality:'dictation'});if(state==='unavailable')recognition.processLocally=false}
   recognition.start();
 }catch(e){alert('Could not start microphone: '+(e?.message||e))}
}
