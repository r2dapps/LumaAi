async function probeCacheArtifacts(id){

     <div class="model-progress sticky-top ${S.modelDownload?.active||S.modelDownload?.error||S.modelDownload?.done?'show':''} ${S.modelDownload?.error?'error':''} ${S.modelDownload?.done&&!S.modelDownload?.error?'done':''}" id="modelProgressWrap">
       <div class="model-progress-head"><span class="model-progress-label" id="modelProgressLabel">${esc(S.modelDownload?.label||'')}</span><span class="model-progress-pct" id="modelProgressPct">${S.modelDownload?.progress!=null?Math.round(S.modelDownload.progress*100)+'%':''}</span></div>
       <div class="model-progress-track"><div class="model-progress-bar" id="modelProgressBar" style="width:${S.modelDownload?.progress!=null?Math.max(0,Math.min(100,Math.round(S.modelDownload.progress*100))):S.modelDownload?.active?'36':0}%;"></div></div>
       <div class="model-progress-note" id="modelProgressNote">${esc(S.modelDownload?.note||'')}</div><div class="model-progress-time" id="modelProgressTime"></div>
     </div>
     <div class="model-hero">
       <div class="model-hero-top"><div><div class="model-hero-title">Local model runtime</div><div class="model-hero-meta"><b>One model loaded at a time.</b> Downloads stay cached until you delete them.</div></div><span class="model-status-badge ${S.engine?'ready':''}">${S.engine?`Loaded · ${esc(loadedRec?.label||S.loadedModel||'model')}`:'No model loaded'}</span></div>
       <div class="model-control-row"><select class="field" id="loadedModelSelect">${downloadedOptions}</select><button class="mini-btn" id="loadSelectedModel" ${cached.length?'':'disabled'}>Load selected</button></div>
       <div class="model-status-line"><span>${cached.length?`${cached.length} downloaded model${cached.length===1?'':'s'}`:'No downloaded models yet'}</span><span>${S.engine?'1 loaded':'0 loaded'}</span></div><button class="mini-btn" id="verifyDownloadedModels" style="width:100%;margin-top:8px" ${cached.length?'':'disabled'}>Verify downloaded models</button>
       ${S.engine?`<button class="mini-btn" id="unloadCurrentModel" style="width:100%;margin-top:8px">Unload current model</button>`:''}
     </div>
     <details class="settings-details" open><summary>Downloaded models <span>${cached.length}</span></summary><div class="details-body"><div class="downloaded-models" style="border:0;border-radius:0;margin-top:0">${downloadedHtml}</div></div></details>
     <details class="settings-details"><summary>Selected model limits & compatibility</summary><div class="details-body">${modelMetaHtml(selected,compatible)}<p class="data-note">${/phi\s*2/i.test(selected?.label||'')?'Phi-2 is an older small model and may follow the companion prompt poorly. A newer instruct model is recommended for natural conversation.':selectedIsCached?(S.cacheStates?.[selected?.id]?'This selected model is locally cached and verified.':'This selected model has a durable download record, but the browser has not confirmed every required artifact yet.'):'This model is not downloaded yet.'} Compatibility is a conservative estimate from WebGPU limits, browser-reported memory, required features and the device benchmark; actual load/generation performance can differ. Download state is persisted locally so browser restarts do not erase the model registry.</p></div></details>
     <details class="settings-details"><summary>Model catalogue <span>${MODELS.length}</span></summary><div class="details-body"><p class="data-note" style="margin:9px 0 6px">Download once, then load locally whenever you need it. Approximate GPU-memory figures below are runtime estimates, not exact network download sizes.</p><div class="model-catalog" id="cacheList" style="max-height:340px">${catalog}</div></div></details>
     <details class="settings-details"><summary>Performance & benchmarks</summary><div class="details-body"><div class="model-control-row" style="margin-top:10px"><button class="mini-btn" id="benchmarkGpu">${S.modelBench?'Run GPU test again':'Test this device'}</button><button class="mini-btn" id="benchmarkModel" ${S.engine?'':'disabled'}>${activeBench?`Benchmark again · ${Number(activeBench.tokps).toFixed(1)} tok/s`:'Benchmark loaded model'}</button></div>${bench?`<div class="model-section"><div class="model-section-title">GPU history</div><div class="bench-history">${bench}</div></div>`:'<p class="data-note" style="margin-top:10px">Run the device test to store a local performance baseline.</p>'}${activeBench?`<div class="model-section"><div class="model-section-title">Loaded model performance</div><div class="bench-item"><span>${esc(loadedRec?.label||'Model')}</span><span>${Number(activeBench.tokps).toFixed(1)} tok/s · ${Number(activeBench.ms).toFixed(0)} ms</span></div></div>`:''}</div></details>
     <details class="settings-details"><summary>Generation controls</summary><div class="details-body"><div class="gen-grid" style="margin-top:10px"><div class="gen-field"><label>Temperature</label><div class="range-compact"><input type="range" id="gTemperature" min="0.1" max="1.2" step="0.01" value="${g.temperature}"><output id="oTemperature">${Number(g.temperature).toFixed(2)}</output></div></div><div class="gen-field"><label>Top P</label><div class="range-compact"><input type="range" id="gTopP" min="0.5" max="1" step="0.01" value="${g.topP}"><output id="oTopP">${Number(g.topP).toFixed(2)}</output></div></div><div class="gen-field"><label>Repetition penalty</label><div class="range-compact"><input type="range" id="gRep" min="1" max="1.3" step="0.01" value="${g.repetitionPenalty}"><output id="oRep">${Number(g.repetitionPenalty).toFixed(2)}</output></div></div><div class="gen-field"><label>Max response tokens</label><select class="field" id="gMaxTokens">${[128,256,384,512,768,1024].map(v=>`<option value="${v}" ${Number(g.maxTokens)===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="gen-field"><label>Context window</label><select class="field" id="gContext">${[1024,2048,4096].map(v=>`<option value="${v}" ${(Number(g.contextWindow)===v||(![1024,2048,4096].includes(Number(g.contextWindow))&&v===Math.min(4096,contextLimit)))?'selected':''} ${v>contextLimit?'disabled':''}>${v} tokens</option>`).join('')}</select></div></div><p class="note">Context management trims older turns and reserves response space before generation to avoid context-overflow errors.</p></div></details>
     <details class="settings-details"><summary>Cache management</summary><div class="details-body"><button class="mini-btn danger" id="clearModelCache" style="width:100%;margin-top:10px">Delete all downloaded models</button><p class="data-note">Deleting a model removes its WebLLM model, WASM and chat-config cache records. Conversations, memories and companion settings remain.</p></div></details>
   </div>
 </div>
 <div class="pane ${tab==='data'?'active':''}" data-pane="data">
   <div class="model-section" style="margin-top:0"><div class="model-section-title">Storage</div><div class="refresh-stats"><span id="storageUpdated">Not checked yet</span><button class="mini-btn" id="refreshStorageStats" type="button">Refresh storage stats</button></div><div id="dataStats"><div class="field-help">Storage stats are read only when you click Refresh, so opening Settings does not scan storage.</div></div></div>
   <div class="model-section"><div class="model-section-title">Install Luma</div><div class="install-card"><strong>Use Luma like an app</strong><p id="installDescription">Install status: ${esc(pwaStateText())}</p><div class="install-row"><button class="mini-btn" id="installLumaBtn" type="button">${isIOS()?'How to install':'Install Luma'}</button><span class="install-status" id="installStatus">${esc(pwaStateText())}</span></div><details class="install-help"><summary>Android / iPhone / iPad instructions</summary><p><b>Android / Chromium:</b> use Install Luma when the browser exposes the install prompt. <b>iPhone / iPad:</b> open Luma in Safari, tap Share, then Add to Home Screen.</p></details></div></div>
   <div class="model-section"><div class="model-section-title">Backup</div><div class="data-actions"><button class="primary" id="exportData">Export Luma backup</button><button class="mini-btn" id="importData">Import backup</button><button class="mini-btn" id="exportChats">Export current chat</button></div><p class="data-note">Backups include conversations, pins, archives, companion profile, memories and generation settings. Downloaded model weights are not exported.</p></div>
   <div class="model-section"><div class="model-section-title">Data controls</div><button class="mini-btn danger" id="clearChats" style="width:100%">Clear conversations only</button><button class="mini-btn danger" id="clearData" style="width:100%;margin-top:8px">Clear Luma data</button><p class="data-note">Clearing Luma data keeps downloaded AI models. Use Model → Cache management to remove model files.</p></div>
 </div>`;
}

 $('saveComp')?.addEventListener('click',()=>{S.comp.name=$('cName').value.trim()||'Emma';S.comp.gender=$('cGender').value;S.comp.age=$('cAge').value;S.comp.role=$('cRole').value;S.comp.customRole=$('cCustomRole').value.trim();S.comp.tone=$('cTone').value;S.comp.conversationMode=$('cMode')?.value||'Casual';S.comp.relationshipStage=$('rStage')?.value||'New connection';S.comp.initiative=$('initiativeToggle')?.checked!==false;S.comp.nicknames=String($('uNicknames')?.value||'').split(',').map(v=>v.trim()).filter(Boolean).slice(0,12);S.comp.companionNickname=$('compNickname')?.value.trim()||'';S.comp.relationshipRules=$('relationshipRule')?.value.trim()||'';S.comp.userName=$('uName').value.trim();S.comp.userGender=$('uGender').value;S.comp.pronouns=$('uPronouns').value;S.comp.nickname=$('uNickname').value.trim();S.comp.addressMode=$('uAddress').value;for(const k of ['warmth','humor','energy','formality','proactivity','emoji'])S.comp[k]=+$('r_'+k).value;save();$('sideName').textContent=S.comp.name;$('sideAvatar').textContent=initials();closePanels();renderMessages()});
 $('loadedModelSelect')?.addEventListener('change',e=>{if(e.target.value&&isModelDownloaded(e.target.value)){S.model=e.target.value;save();renderModelProgress();const pane=document.querySelector('[data-pane="model"]');if(pane){const details=pane.querySelectorAll('.settings-details');if(details[1])details[1].open=true}}});

 document.querySelectorAll('[data-model-action]').forEach(b=>b.onclick=async()=>{if(S.loading)return;const id=b.dataset.modelAction;S.model=id;save();await downloadModelOnly(id)});
 $('loadSelectedModel')?.addEventListener('click',async()=>{const id=$('loadedModelSelect').value;if(!id||S.loading)return;S.model=id;save();await loadEngine(id);if(document.querySelector('[data-pane="model"]')){const pane=document.querySelector('[data-pane="model"]');const wasScroll=pane?.scrollTop||0;$('settingsSheet').innerHTML=settingsHTML('model');bindSettings();renderModelProgress();renderInstallState();const np=document.querySelector('[data-pane="model"]');if(np)np.scrollTop=wasScroll}});

 $('verifyDownloadedModels')?.addEventListener('click',async()=>{if(S.loading)return;const b=$('verifyDownloadedModels');b.disabled=true;b.textContent='Verifying…';await refreshCacheStates({forceAll:false});if(document.querySelector('[data-pane="model"]'))$('verifyDownloadedModels').textContent='Verify downloaded models'});

 $('benchmarkModel')?.addEventListener('click',async()=>{if(S.loading)return;const b=$('benchmarkModel');b.disabled=true;b.textContent='Benchmarking…';const r=await benchmarkLoadedModel();if(r)b.textContent=`Model ${Number(r.tokps).toFixed(1)} tok/s`;else b.textContent='Benchmark loaded model';save()});
 const ranges=[['gTemperature','temperature','oTemperature',2],['gTopP','topP','oTopP',2],['gRep','repetitionPenalty','oRep',2]];ranges.forEach(([id,key,out,digits])=>{$(id)?.addEventListener('input',e=>{S.generation[key]=+e.target.value;$(out).textContent=S.generation[key].toFixed(digits);save()})});
 $('gMaxTokens')?.addEventListener('change',e=>{S.generation.maxTokens=+e.target.value;save()});$('gContext')?.addEventListener('change',e=>{S.generation.contextWindow=Math.min(+e.target.value,modelContextLimit(S.model));save()});

}

let deferredInstallPrompt=null;
function canInstallDirect(){return !!deferredInstallPrompt}
async function installLuma(){
 if(window.matchMedia?.('(display-mode: standalone)').matches||navigator.standalone===true)return;
 if(deferredInstallPrompt){const ev=deferredInstallPrompt;deferredInstallPrompt=null;try{const r=await ev.prompt();setStatus(r?.outcome==='accepted'?'Luma installed':'Install prompt dismissed');renderInstallState();}catch{}} else if(isIOS()){alert('On iPhone or iPad: open this site in Safari, tap Share, then choose “Add to Home Screen”. On newer iOS versions this can also be available from the browser Share menu.');} else {alert('The browser has not exposed the install prompt yet. Make sure Luma is served from localhost or HTTPS, then reload once.');}
}
function initPWA(){
 if('serviceWorker' in navigator&&location.protocol!=='file:'){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
 window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;window.__lumaInstallPrompt=true;const b=$('pwaBanner');if(b)b.hidden=false;renderInstallState()});
 window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;window.__lumaInstallPrompt=false;const b=$('pwaBanner');if(b)b.hidden=true;renderInstallState();setStatus('Luma installed')});
 $('pwaInstall')?.addEventListener('click',installLuma);$('pwaLater')?.addEventListener('click',()=>{$('pwaBanner').hidden=true;localStorage.setItem('luma_pwa_banner_dismissed','1')});
 if(isIOS()&&!window.matchMedia?.('(display-mode: standalone)').matches&&!localStorage.getItem('luma_pwa_banner_dismissed')){const b=$('pwaBanner');if(b){b.hidden=false;$('pwaInstall').textContent='How to install'}}
}
initPWA();

function currentModelSupportsVision(){const m=modelRecord(S.loadedModel||S.model);if(!m)return false;const t=String(m.modelType||m.model_id||m.label||m.id||'');return /VLM|vision|llava|smolvlm|qwen.*vl|phi.*vision/i.test(t)}
function updateImageButton(){const b=$('imageBtn');if(!b)return;const show=currentModelSupportsVision();b.classList.toggle('hidden',!show);b.disabled=!show;if(!show&&S.draftImage){S.draftImage=null;renderAttachmentPreview()}}
$('imageBtn').onclick=()=>{if(currentModelSupportsVision())$('imageInput').click()};$('imageInput').onchange=e=>{if(currentModelSupportsVision())addImageFile(e.target.files[0]);e.target.value=''};$('clearAttachment').onclick=()=>{S.draftImage=null;renderAttachmentPreview();renderSendState()};
$('send').onclick=()=>send($('input').value);$('input').oninput=resize;$('input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send(e.target.value)}};
let recognition=null;let recognizing=false;function speechCtor(){return window.SpeechRecognition||window.webkitSpeechRecognition||null}
async function startVoice(){
 const C=speechCtor();if(!C){alert('Voice input is not supported by this browser. Try current Chrome or Edge.');return}
 if(recognizing){try{recognition.stop()}catch{}return}
 recognition=new C();recognition.lang='en-IN';recognition.interimResults=true;recognition.continuous=false;recognition.maxAlternatives=1;

let WLLAMA_RUNTIME=null,WASM_ENGINE=null;
async function importWllama(){if(!WLLAMA_RUNTIME)WLLAMA_RUNTIME=await import('https://esm.sh/@wllama/wllama@3.6.1');return WLLAMA_RUNTIME}
async function loadWasmFallback(){
  if(WASM_ENGINE)return true;const url=String(S.wasmFallback?.url||'').trim();if(!url)throw new Error('Set a GGUF model URL first.');
  const w=await importWllama();const W=w.Wllama||w.default; if(!W)throw new Error('Wllama runtime was not found.');
  const instance=new W({default:'https://cdn.jsdelivr.net/npm/@wllama/wllama@3.6.1/esm/wasm/wllama.wasm'});
  setStatus('Loading WASM fallback…',true);S.loading=true;S.loadingKind='model';renderSendState();
  try{await instance.loadModelFromUrl(url,{n_ctx:Math.min(Number(S.generation.contextWindow)||2048,4096),n_gpu_layers:0,progressCallback:o=>{const p=o?.total?o.loaded/o.total:null;setModelProgress(true,'WASM fallback model…','Loading custom GGUF model.',p,false,false)}});WASM_ENGINE=instance;S.wasmFallback.loaded=true;save();return true}
  finally{S.loading=false;S.loadingKind='idle';renderSendState()}
}
async function unloadWasmFallback(){try{await WASM_ENGINE?.exit?.()}catch{}WASM_ENGINE=null;S.wasmFallback.loaded=false;save()}
async function generateWasmFallback(history,target){
  if(!WASM_ENGINE){try{await loadWasmFallback()}catch(e){target.error=true;target.errorMessage='WASM fallback could not load: '+(e?.message||e);renderMessages();return false}}
  const c=current(),idx=c?c.messages.indexOf(target):-1;S.loading=true;S.loadingKind='generation';S.generatingMessageKey=c&&idx>=0?`${c.id}:${idx}`:null;renderSendState();setStatus('WASM · Generating…',true);lanAbortController=new AbortController();renderMessages();
  try{let currentText='';await WASM_ENGINE.createChatCompletion({messages:history,max_tokens:responseTokenBudget(),temperature:Number(S.generation.temperature)||.72,top_p:Number(S.generation.topP)||.9,stream:true,abortSignal:lanAbortController.signal},);/* some Wllama builds expose streaming via async iterable; use direct call again if needed below */
    return true;
  }catch(e){try{const res=await WASM_ENGINE.createChatCompletion({messages:history,max_tokens:responseTokenBudget(),temperature:Number(S.generation.temperature)||.72,top_p:Number(S.generation.topP)||.9});target.content=sanitizeAssistantText(res?.choices?.[0]?.message?.content||res?.choices?.[0]?.text||'');if(!target.content)throw e;return true}catch(e2){target.error=true;target.content='';target.errorMessage=e2?.message||e?.message||String(e2);return false}}
  finally{S.loading=false;S.loadingKind='idle';S.generatingMessageKey=null;renderSendState();setStatus('WASM · Ready',true);save()}
}

lanPanelHtml=function(){return `<details class="settings-details"><summary>LAN / PC Power Mode</summary><div class="details-body"><div class="phase8-card"><strong>Use a local PC model server</strong><p>Route chat to Ollama or another OpenAI-compatible local endpoint. This is optional. An HTTPS GitHub Pages page cannot call an HTTP LAN URL in normal browser security rules; use HTTPS for the LAN endpoint or a local HTTP development origin.</p><label style="font-size:11px"><input type="checkbox" id="lanEnabled" ${S.lan.enabled?'checked':''}> Use PC/LAN model instead of browser WebGPU</label><div class="phase-grid" style="margin-top:8px"><div><label class="field-label">Provider</label><select class="field" id="lanProvider"><option value="ollama-openai" ${S.lan.provider==='ollama-openai'?'selected':''}>Ollama · OpenAI compatible</option><option value="ollama-native" ${S.lan.provider==='ollama-native'?'selected':''}>Ollama · native API</option><option value="openai" ${S.lan.provider==='openai'?'selected':''}>OpenAI-compatible local server</option></select></div><div><label class="field-label">Model</label><input class="field" id="lanModel" value="${esc(S.lan.model||'')}" placeholder="e.g. llama3.2:3b"><div class="field-help" id="lanModelHelp">${esc(S.lan.models?.length?S.lan.models.join(', '):'Refresh to discover PC models.')}</div></div></div><label class="field-label">Endpoint</label><input class="field" id="lanEndpoint" value="${esc(S.lan.endpoint)}"><label class="field-label">API key (optional)</label><input class="field" id="lanApiKey" type="password" value="${esc(S.lan.apiKey||'')}"><div class="inline-actions" style="margin-top:8px"><button class="mini-btn" id="testLan" type="button">Test connection</button><button class="mini-btn" id="refreshLanModels" type="button">Refresh PC models</button></div><div class="field-help" id="lanStatus" style="margin-top:6px">${esc(S.lan.lastTest||'LAN mode is optional and off by default.')}</div></div></div></details>`};
wasmPanelHtml=function(){return `<details class="settings-details"><summary>WASM fallback · experimental</summary><div class="details-body"><div class="phase8-card"><strong>Phase 4 CPU/WASM fallback</strong><p>Optional Wllama/llama.cpp browser inference when WebGPU is unavailable. Supply a small GGUF URL. This remains experimental and is not bundled with the normal WebLLM model catalogue.</p><label style="font-size:11px"><input type="checkbox" id="wasmEnabled" ${S.wasmFallback.enabled?'checked':''}> Enable automatic WASM fallback when WebGPU is unavailable</label><label class="field-label" style="margin-top:8px">GGUF model URL</label><input class="field" id="wasmUrl" value="${esc(S.wasmFallback.url||'')}" placeholder="https://example.com/model.gguf"><div class="inline-actions" style="margin-top:8px"><button class="mini-btn" id="testWasmFallback" type="button">Load / test fallback</button><button class="mini-btn" id="unloadWasmFallback" type="button" ${WASM_ENGINE?'':'disabled'}>Unload fallback</button></div><div class="field-help">For true offline fallback use, self-host the GGUF and Wllama runtime assets.</div></div></div></details>`};

diagnosticsHtml=function(){const gpu=!!navigator.gpu,speech=!!speechCtor(),idb=!!window.indexedDB,pwa='serviceWorker'in navigator;return `<details class="settings-details"><summary>Diagnostics & self-test</summary><div class="details-body"><div class="diagnostic-card" style="margin-top:0"><strong>Local capability</strong><div class="diagnostic-grid"><div class="diag ${gpu?'ok':'off'}"><b>${gpu?'Available':'Unavailable'}</b><span>WebGPU</span></div><div class="diag ${idb?'ok':'off'}"><b>${idb?'Available':'Unavailable'}</b><span>IndexedDB</span></div><div class="diag ${speech?'ok':'warn'}"><b>${speech?'Available':'Unavailable'}</b><span>Browser speech recognition</span></div><div class="diag ${pwa?'ok':'warn'}"><b>${pwa?'Available':'Unavailable'}</b><span>Service worker</span></div></div></div><div class="v12-action"><button class="mini-btn" id="runSelfTest" type="button">Run Luma self-test</button></div><div id="selfTestResults"><div class="field-help" style="margin-top:8px">Runs local checks without downloading a model.</div></div></div></details>`};

/* Built-in cross-checks for the user/device. */
async function runSelfTest(){
  const out=$('selfTestResults');if(!out)return;out.innerHTML='<div class="field-help">Running local checks…</div>';
  const r=[];const ok=(name,detail=true)=>r.push({name,pass:!!detail,detail:detail===true?'Passed':String(detail)});const warn=(name,detail)=>r.push({name,pass:null,detail});
  try{localStorage.setItem('__luma_test','1');localStorage.removeItem('__luma_test');ok('Local settings storage',true)}catch(e){ok('Local settings storage',e?.message||e)}
  ok('IndexedDB available',!!window.indexedDB);
  try{await openLumaDB();ok('IndexedDB database opens',!!db)}catch(e){ok('IndexedDB database opens',e?.message||e)}
  ok('Companion profile is valid',!!S.comp?.name&&Array.isArray(S.comp?.memories));
  ok('Conversation store is valid',Array.isArray(S.chats));
  ok('Memory candidate extractor',!!memoryCandidateFromText('My name is LumaTest'));
  ok('Markdown/code renderer',/tok-key|code-wrap/.test(markdown('```js\\nconst x=1\\n```')));
  ok('Math renderer',/math-rendered/.test(markdown('$$x^2$$')));
  ok('Image capability gate',typeof currentModelSupportsVision==='function');
  ok('Copy pipeline',typeof copyToClipboard==='function'&&typeof copyText==='function');
  ok('Chat actions wired',typeof renameChat==='function'&&typeof togglePin==='function'&&typeof toggleArchive==='function'&&typeof deleteChat==='function');
  ok('Edit/regenerate/branch wired',typeof editMessage==='function'&&typeof regenerateFromUser==='function'&&typeof branchFrom==='function');
  ok('Stop generation wired',typeof interruptGeneration==='function');
  ok('Model cache controls wired',typeof downloadModelOnly==='function'&&typeof loadEngine==='function'&&typeof deleteDownloadedModel==='function');
  ok('WebLLM catalogue loaded',MODELS.length>0);
  warn('WebGPU device',navigator.gpu?'Available on this browser':'Unavailable on this browser');
  warn('On-device speech',('SpeechRecognition'in window||'webkitSpeechRecognition'in window)&&('processLocally'in (window.SpeechRecognition?new window.SpeechRecognition():window.webkitSpeechRecognition?new window.webkitSpeechRecognition():{}))?'Browser exposes local speech controls':'Browser may require remote speech or does not expose local speech controls');
  warn('PWA support','serviceWorker'in navigator?'Service worker API available':'Service worker API unavailable');
  warn('Model cache',S.loadedModel?`Loaded: ${S.loadedModel}`:(Object.keys(S.modelCacheMeta||{}).filter(v12ModelMetaDownloaded).length?`${Object.keys(S.modelCacheMeta||{}).filter(v12ModelMetaDownloaded).length} durable download record(s)`:'No durable model record yet'));
  S.selfTest={at:Date.now(),results:r};save();out.innerHTML='<div class="v12-test-list">'+r.map(x=>`<div class="v12-test"><b class="${x.pass===true?'v12-pass':x.pass===false?'v12-fail':'v12-warn'}">${x.pass===true?'PASS':x.pass===false?'CHECK':'INFO'}</b><span>${esc(x.name)} — ${esc(x.detail)}</span></div>`).join('')+'</div>';
}
/* Add self-test binding on every settings render, without disturbing existing controls. */
const v12BaseBindSettings=bindSettings;
bindSettings=function(){
  v12BaseBindSettings();
  $('runSelfTest')?.addEventListener('click',()=>runSelfTest());
  const mode=$('cMode');if(mode)mode.addEventListener('change',()=>{S.comp.conversationMode=mode.value;save()});
  const age=$('cAge');if(age)age.addEventListener('change',()=>{S.comp.age=age.value;save()});
};

/* Persist the new state fields on app hydration. */
const v12BaseHydrate=hydrateFromIndexedDB;
hydrateFromIndexedDB=async function(){await v12BaseHydrate();S.downloadHistory=Array.isArray(S.downloadHistory)?S.downloadHistory:[];S.addressUseCount=Number(S.addressUseCount)||0;S.selfTest=S.selfTest||null;save()};

})();

</script>
