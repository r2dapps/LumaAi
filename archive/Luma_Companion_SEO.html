const defaults={name:'Emma',gender:'Female',age:'18+',role:'Companion',customRole:'',tone:'Natural',warmth:82,humor:62,energy:55,formality:18,proactivity:38,emoji:25,words:[{w:'bro',f:'occasional'},{w:'okay okay',f:'rare'}],avoid:[],memories:[],userName:'',userGender:'Prefer not to say',pronouns:'they/them',nickname:'',addressMode:'name'};
let S={comp:{...defaults,words:defaults.words.map(x=>({...x})),avoid:[]},chats:[],active:null,model:null,engine:null,loading:false,search:'',device:null,modelBench:null};
try{const x=JSON.parse(localStorage.getItem('luma_companion_v4')||localStorage.getItem('krono_companion_v3')||'null');if(x){S={...S,...x};S.comp={...defaults,...(x.comp||{})};S.comp.words=Array.isArray(S.comp.words)?S.comp.words:defaults.words.map(x=>({...x}));S.comp.avoid=Array.isArray(S.comp.avoid)?S.comp.avoid:[];S.comp.memories=Array.isArray(S.comp.memories)?S.comp.memories:[]}}catch{}
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem('luma_companion_v4',JSON.stringify({comp:S.comp,chats:S.chats,active:S.active,model:S.model}));}
function initials(){return (S.comp.name||'E').trim().charAt(0).toUpperCase()||'E'}
function ensureChat(){if(S.active&&S.chats.some(c=>c.id===S.active))return;const c={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),title:'New chat',messages:[],updated:Date.now()};S.chats.unshift(c);S.active=c.id;save()}
function current(){return S.chats.find(c=>c.id===S.active)||null}
function renderChats(){
  const q=S.search.toLowerCase();
  $('chatList').innerHTML=S.chats.filter(c=>!q||c.title.toLowerCase().includes(q)).map(c=>`<button class="chat-item ${c.id===S.active?'active':''}" data-chat="${c.id}"><span class="chat-title">${esc(c.title)}</span><span class="chat-more" data-delete="${c.id}" title="Delete">⋯</span></button>`).join('');
  document.querySelectorAll('[data-chat]').forEach(b=>{
    b.onclick=e=>{
      const del=e.target.closest('[data-delete]');
      if(del){deleteChat(del.dataset.delete);return;}
      S.active=b.dataset.chat; save(); renderChats(); renderMessages(); closeSidebar();
    };
  });
}
function deleteChat(id){S.chats=S.chats.filter(c=>c.id!==id);S.active=S.chats[0]?.id||null;ensureChat();save();renderChats();renderMessages()}
function markdown(t){let s=esc(t);const blocks=[];s=s.replace(/```([\w+-]*)\n?([\s\S]*?)```/g,(_,lang,code)=>{const i=blocks.push(`<div class="code-wrap"><div class="code-head"><span>${esc(lang||'code')}</span><button onclick="copyText(this)">Copy</button></div><pre class="code">${code.trim()}</pre></div>`)-1;return `@@CODE${i}@@`});s=s.replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/^[-*] (.*)$/gm,'• $1').replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>');s='<p>'+s+'</p>';return s.replace(/@@CODE(\d+)@@/g,(_,i)=>blocks[+i])}
function copyText(btn){const pre=btn.closest('.code-wrap')?.querySelector('pre');if(pre)navigator.clipboard?.writeText(pre.innerText);btn.textContent='Copied';setTimeout(()=>btn.textContent='Copy',900)}
function renderMessages(){const c=current();$('chatTitlebar').textContent=c?.title||'New chat';if(!c||!c.messages.length){$('messageStack').innerHTML=`<div class="welcome"><div class="welcome-logo"><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3.5 13.9 10l6.1 2-6.1 2L12 20.5 10.1 14 4 12l6.1-2L12 3.5Z"/></svg></div><h1>${esc(S.comp.userName?`Hi ${S.comp.userName}, I’m ${S.comp.name}.`:`Hi, I’m ${S.comp.name}.`)}</h1><p>${esc(S.comp.userName?`I’ll address you as ${S.comp.addressMode==='nickname'&&S.comp.nickname?S.comp.nickname:S.comp.userName}. What would you like to talk about today?`:`Set your name and preferences in Settings so ${S.comp.name} knows how to address you.`)}</p><div class="suggestions"><button class="suggestion" data-prompt="Tell me something interesting">Tell me something interesting</button><button class="suggestion" data-prompt="Let's have a casual chat">Let's have a casual chat</button><button class="suggestion" data-prompt="Help me plan my day">Help me plan my day</button></div></div>`;document.querySelectorAll('[data-prompt]').forEach(b=>b.onclick=()=>send(b.dataset.prompt));return}
$('messageStack').innerHTML=c.messages.map((m,i)=>{const isA=m.role==='assistant';return `<article class="msg ${isA?'assistant':'user'}"><div class="msg-avatar">${isA?initials():'You'}</div><div class="msg-body"><div class="bubble">${m.content?markdown(m.content):'<span class="typing"><i></i><i></i><i></i></span>'}</div>${m.content?`<div class="msg-actions">${isA?`<button onclick="copyMsg(${i})" title="Copy">⧉</button><button onclick="speakMsg(${i})" title="Read aloud">◖</button><button onclick="regen(${i})" title="Regenerate">↻</button>`:`<button onclick="copyMsg(${i})" title="Copy">⧉</button><button onclick="rememberMessage(${i})" title="Remember this">☆</button>`}</div>`:''}</div></article>`}).join('');$('messages').scrollTop=$('messages').scrollHeight}
function copyMsg(i){const c=current();navigator.clipboard?.writeText(c.messages[i]?.content||'')}
function systemPrompt(){const c=S.comp;const words=c.words?.map(x=>`${x.w} (${x.f})`).join(', ')||'none';const avoid=c.avoid?.join(', ')||'none';const role=c.role==='Custom role'?(c.customRole||'general companion'):c.role;const address=c.addressMode==='nickname'?(c.nickname||c.userName||'the user'):c.addressMode==='name'?(c.userName||c.nickname||'the user'):'the user';const memories=(c.memories||[]).slice(-30).map(m=>`- ${m.text}`).join('\n')||'- none saved';return `You are ${c.name}, a ${c.gender.toLowerCase()} AI companion. Speak natural English by default. Your role is ${role}. Tone: ${c.tone}. Personality levels — warmth ${c.warmth}/100, humor ${c.humor}/100, energy ${c.energy}/100, formality ${c.formality}/100, proactivity ${c.proactivity}/100, emoji ${c.emoji}/100. Preferred words/phrases: ${words}. Avoid: ${avoid}. Use preferred vocabulary naturally, never mechanically. You are talking TO the user, not pretending to be the user. User profile: name ${c.userName||'not provided'}; gender ${c.userGender}; pronouns ${c.pronouns}; preferred form of address ${address}. Refer to the user with their stated name/nickname and pronouns when relevant; never invent a name, gender, or pronouns. Do not speak as if you are the user, and do not narrate their thoughts or actions as facts. Be attentive to who is speaking. Persistent user memories (use only when relevant; do not claim certainty beyond what is written):\n${memories}\nThe profile label is ${c.age}; if it is 16+, keep interaction age-appropriate and non-sexual, including for romantic relationship roles. An 18+ profile permits a mature conversational tone but does not remove applicable safety boundaries. Be conversational, warm, and useful without claiming to be human or physically present. Do not encourage dependency, isolation, exclusivity, or harmful behavior.`}
function setStatus(text,ok=false){$('statusText').textContent=text;$('statusDot').classList.toggle('ok',ok)}
function cleanModelLabel(id){return id.replace(/-q4f\d+_\d+-MLC$/i,'').replace(/-MLC$/i,'').replace(/-/g,' ').replace(/\bInstruct\b/g,'Instruct').replace(/\s+/g,' ').trim()}
function formatModel(m){const mb=Number(m.vram_required_MB||m.vram_required_mb||m.vram||0);const gb=mb?`~${(mb/1024).toFixed(1)} GB`:'size varies';const tier=mb<=1600?'light':mb<=2600?'mobile':mb<=4200?'balanced':'power';return {id:m.model_id||m.id,label:cleanModelLabel(m.model_id||m.id),desc:`${tier==='power'?'High-end':tier==='balanced'?'Balanced':tier==='mobile'?'Mobile-friendly':'Lightweight'} · ${gb} GPU memory`,tier,size:gb,vram:mb,low:!!m.low_resource_required,buffer:Number(m.buffer_size_required_bytes||0),features:Array.isArray(m.required_features)?m.required_features:[],modelType:m.model_type||'LLM'}};
async function hydrateModels(){try{const w=await importWebLLM();const list=w.prebuiltAppConfig?.model_list||[];const seen=new Set();const dynamic=list.map(formatModel).filter(m=>m.id&&!seen.has(m.id)&&seen.add(m.id));if(dynamic.length)MODELS=dynamic;if(!MODELS.some(m=>m.id===S.model))S.model=deviceModel(S.device||{}).id;save();return true}catch(e){return false}}
function isMobileDevice(){return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)}
function softVramBudget(info={}){const mem=Number(info.memory||navigator.deviceMemory||0);const mobile=isMobileDevice();let base;if(mobile)base=mem<=2?1200:mem<=3?1550:mem<=4?2100:mem<=6?2800:3400;else base=mem<=4?2000:mem<=8?3600:mem<=16?5200:7000;if(info.benchmarkScore){const mult=info.benchmarkScore<25?.82:info.benchmarkScore<55?1:1.15;base*=mult}return Math.round(base)}
function modelCompatibility(m,info=S.device||{}){if(!info.gpu)return {status:'unavailable',reason:'WebGPU unavailable'};if(m.features?.length&&info.features&&m.features.some(f=>!info.features.includes(f)))return {status:'unavailable',reason:`Needs ${m.features.find(f=>!info.features.includes(f))}`};if(m.buffer&&info.maxBuffer&&m.buffer>info.maxBuffer)return {status:'unavailable',reason:'GPU buffer limit too low'};const budget=softVramBudget(info);if(m.vram&&m.vram>budget*1.35)return {status:'heavy',reason:`Above conservative ${Math.round(budget/1024*10)/10} GB budget`};if(m.vram&&m.vram>budget)return {status:'possible',reason:'May work, but leaves less headroom'};return {status:'compatible',reason:m.low?'Low-resource model':'Fits conservative budget'}}
function deviceModel(info={}){const ranked=MODELS.map(m=>({m,c:modelCompatibility(m,info)})).filter(x=>x.c.status==='compatible'||x.c.status==='possible').sort((a,b)=>{const as=a.c.status==='compatible'?0:1,bs=b.c.status==='compatible'?0:1;if(as!==bs)return as-bs;return (b.m.vram||999999)-(a.m.vram||999999)});return ranked[0]?.m||MODELS.slice().sort((a,b)=>(a.vram||999999)-(b.vram||999999))[0]}
async function detectDevice(){const info={memory:navigator.deviceMemory||null,cores:navigator.hardwareConcurrency||null,gpu:false,adapter:null,maxBuffer:null,features:[]};if(navigator.gpu){try{const a=await navigator.gpu.requestAdapter({powerPreference:isMobileDevice()?'low-power':'high-performance'});if(a){info.gpu=true;info.adapter=a.info?.description||a.info?.device||a.info?.vendor||'WebGPU';info.maxBuffer=a.limits?.maxStorageBufferBindingSize||null;info.features=[...a.features]}}catch{}}S.device=info;return info}
async function benchmarkGPU(){if(!S.device?.gpu||!navigator.gpu)return null;try{const adapter=await navigator.gpu.requestAdapter({powerPreference:isMobileDevice()?'low-power':'high-performance'});if(!adapter)return null;const device=await adapter.requestDevice();const count=262144;const buf=device.createBuffer({size:count*4,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_SRC});const read=device.createBuffer({size:4,usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ});const shader=device.createShaderModule({code:`@group(0) @binding(0) var<storage,read_write> data: array<f32>; @compute @workgroup_size(64) fn main(@builtin(global_invocation_id) id: vec3<u32>){let i=id.x;if(i<${count}u){var x=data[i];for(var j=0u;j<32u;j++){x=x*1.000001+0.000001;}data[i]=x;}}`});const pipeline=device.createComputePipeline({layout:'auto',compute:{module:shader,entryPoint:'main'}});const bg=device.createBindGroup({layout:pipeline.getBindGroupLayout(0),entries:[{binding:0,resource:{buffer:buf}}]});const times=[];for(let r=0;r<3;r++){const enc=device.createCommandEncoder();const pass=enc.beginComputePass();pass.setPipeline(pipeline);pass.setBindGroup(0,bg);pass.dispatchWorkgroups(Math.ceil(count/64));pass.end();enc.copyBufferToBuffer(buf,0,read,0,4);const t=performance.now();device.queue.submit([enc.finish()]);await read.mapAsync(GPUMapMode.READ);times.push(performance.now()-t);read.unmap()}const avg=times.reduce((a,b)=>a+b,0)/times.length;device.destroy?.();const score=Math.max(1,Math.min(100,1000/avg*2));S.modelBench={score,ms:avg};S.device.benchmarkScore=score;save();return S.modelBench}catch(e){return null}}
async function importWebLLM(){return await import('https://esm.run/@mlc-ai/web-llm@0.2.85')}
async function cacheState(id){try{const w=await importWebLLM();return !!(await w.hasModelInCache(id))}catch{return false}}
async function refreshCacheStates(){
  const rows=document.querySelectorAll('[data-cache-id]');
  for(const row of rows){const id=row.dataset.cacheId;const el=row.querySelector('.cache-state');if(!el)continue;el.textContent='Checking…';const ok=await cacheState(id);el.textContent=ok?'Cached':'Not downloaded';el.classList.toggle('ready',ok);row.querySelector('[data-load-cache]')?.setAttribute('data-cached',ok?'1':'0')}
}
function openSetup(){const m=MODELS.find(x=>x.id===S.model)||deviceModel(S.device||{});const mc=modelCompatibility(m,S.device||{});const c=S.comp;$('setupCard').innerHTML=`<h2>Welcome to Luma</h2><p>A private AI companion that runs locally in your browser. Let's set up how you want to be addressed and which local model to use.</p><div class="section-divider"></div><label class="field-label">Your name</label><input class="field" id="setupUserName" value="${esc(c.userName)}" placeholder="Your name"><div class="row2"><div><label class="field-label">Your gender</label><select class="field" id="setupUserGender"><option>Prefer not to say</option><option ${c.userGender==='Female'?'selected':''}>Female</option><option ${c.userGender==='Male'?'selected':''}>Male</option><option>Non-binary</option></select></div><div><label class="field-label">Pronouns</label><select class="field" id="setupPronouns"><option ${c.pronouns==='she/her'?'selected':''}>she/her</option><option ${c.pronouns==='he/him'?'selected':''}>he/him</option><option ${c.pronouns==='they/them'?'selected':''}>they/them</option></select></div></div><label class="field-label">What should I call you?</label><div class="row2"><input class="field" id="setupNickname" value="${esc(c.nickname)}" placeholder="Nickname (optional)"><select class="field" id="setupAddress"><option value="name" ${c.addressMode==='name'?'selected':''}>Use my name</option><option value="nickname" ${c.addressMode==='nickname'?'selected':''}>Use my nickname</option><option value="none" ${c.addressMode==='none'?'selected':''}>Don't use a name</option></select></div><div class="section-divider"></div><div class="setup-model"><strong>${esc(m.label)}</strong><span>${esc(m.desc)} · ${mc.status==='compatible'?'recommended for this device':mc.status==='possible'?'possible, with less headroom':'not recommended on this device'}${S.modelBench?.ms?` · GPU test ${S.modelBench.ms.toFixed(0)} ms`:''}</span></div><p>${navigator.gpu?'WebGPU is available. The first download may take a while; the model is cached locally afterward.':'WebGPU is not available in this browser, so local model inference cannot start yet.'}</p><div class="setup-actions"><button class="setup-secondary" id="setupLater">Later</button><button class="setup-primary" id="setupContinue" ${navigator.gpu?'':'disabled'}>Continue & download</button></div>`;$('setupBackdrop').classList.add('show');$('setupLater').onclick=()=>{$('setupBackdrop').classList.remove('show')};$('setupContinue').onclick=async()=>{c.userName=$('setupUserName').value.trim();c.userGender=$('setupUserGender').value;c.pronouns=$('setupPronouns').value;c.nickname=$('setupNickname').value.trim();c.addressMode=$('setupAddress').value;save();$('setupBackdrop').classList.remove('show');await loadEngine(m.id);renderMessages()}}
async function loadEngine(id){
  if(S.loading)return;
  if(!navigator.gpu){setStatus('WebGPU unavailable');alert('Local WebGPU AI is not available in this browser. Try a current Chrome/Edge browser or Safari 18+ on supported hardware.');return}
  if(S.engine&&S.model===id)return;
  S.loading=true;setStatus('Preparing local AI…');$('send').disabled=true;
  try{
    if(S.engine?.unload){try{await S.engine.unload()}catch{}}
    S.engine=null;
    const webllm=await importWebLLM();
    const model=MODELS.find(m=>m.id===id)||deviceModel(S.device||{});
    S.model=model.id;
    const cached=await webllm.hasModelInCache(model.id).catch(()=>false);
    setStatus(cached?'Loading cached model…':'Downloading model…');
    const init=progress=>{const p=progress?.progress!=null?Math.round(progress.progress*100):null;setStatus(p==null?(cached?'Loading cached model…':'Downloading model…'):`Downloading ${p}%`);};
    S.engine=await webllm.CreateMLCEngine(model.id,{initProgressCallback:init,logLevel:'ERROR'});
    setStatus('Local AI ready',true);localStorage.setItem('luma_model_ready','1');save();
  }catch(e){S.engine=null;setStatus('Model unavailable');alert('The local model could not be loaded.\n\n'+(e?.message||e))}
  finally{S.loading=false;$('send').disabled=!$('input').value.trim()}
}
async function generate(history,target){if(!S.engine){await loadEngine(S.model);if(!S.engine)return false}S.loading=true;$('send').disabled=true;setStatus('Generating…',true);try{const res=await S.engine.chat.completions.create({messages:history,stream:true,temperature:.82,top_p:.92,max_tokens:1024});for await(const chunk of res){target.content+=(chunk.choices?.[0]?.delta?.content||'');renderMessages()};return true}catch(e){target.content='I could not complete that local generation. Try again or choose a smaller model.\n\n'+(e?.message||'Unknown local inference error.');renderMessages();return false}finally{S.loading=false;$('send').disabled=!$('input').value.trim();setStatus('Local AI ready',true);save()}}
async function send(text){if(!text.trim()||S.loading)return;ensureChat();const c=current();const clean=text.trim();autoRemember(clean);if(c.messages.length===0)c.title=clean.replace(/\s+/g,' ').slice(0,48);c.messages.push({role:'user',content:clean});c.updated=Date.now();$('input').value='';resize();renderChats();renderMessages();const assistant={role:'assistant',content:''};c.messages.push(assistant);const history=[{role:'system',content:systemPrompt()},...c.messages.slice(0,-1).slice(-28)];await generate(history,assistant);c.updated=Date.now();save();renderChats()}
async function regen(i){const c=current();if(!c||S.loading||c.messages[i]?.role!=='assistant')return;const user=c.messages[i-1];if(!user||user.role!=='user')return;c.messages.splice(i,1);const a={role:'assistant',content:''};c.messages.splice(i,0,a);renderMessages();await generate([{role:'system',content:systemPrompt()},...c.messages.slice(0,i).slice(-28)],a);save()}
function resize(){const x=$('input');x.style.height='auto';x.style.height=Math.min(180,x.scrollHeight)+'px';$('send').disabled=!x.value.trim()||S.loading}
function closeSidebar(){$('sidebar').classList.remove('open')}
function closePanels(){$('backdrop').classList.remove('show');$('settingsSheet').innerHTML=''}
function addMemory(text,source='user'){const v=String(text||'').trim();if(!v)return;const c=S.comp;c.memories=c.memories||[];if(c.memories.some(m=>m.text.toLowerCase()===v.toLowerCase()))return;c.memories.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),text:v,source,created:Date.now()});c.memories=c.memories.slice(-50);save()}
function autoRemember(text){const t=String(text||'').trim();const patterns=[/\bmy name is (.+?)(?:[.!?]|$)/i,/\bi work (?:as|at) (.+?)(?:[.!?]|$)/i,/\bi (?:really )?(?:like|love) (.+?)(?:[.!?]|$)/i,/\bi hate (.+?)(?:[.!?]|$)/i,/\bi(?:'| a)m working on (.+?)(?:[.!?]|$)/i];for(const re of patterns){const m=t.match(re);if(m&&m[1]&&m[1].length<140){addMemory(m[0],'automatic');break}}}
function rememberMessage(i){const c=current();const m=c?.messages[i];if(!m||m.role!=='user')return;addMemory(m.content,'conversation');renderMessages()}
function forgetMemory(id){S.comp.memories=(S.comp.memories||[]).filter(m=>m.id!==id);save();openSettings('memory')}

function settingsHTML(tab='companion'){const c=S.comp;const roleOpts=ROLES.map(r=>`<option ${c.role===r?'selected':''}>${esc(r)}</option>`).join('');const modelRec=deviceModel(S.device||{})||MODELS[0];const memories=(c.memories||[]).slice().reverse();return `<div class="sheet-head"><h2>Settings</h2><button class="close" id="closeSettings">×</button></div><div class="tabs"><button class="tab ${tab==='companion'?'active':''}" data-tab="companion">Companion</button><button class="tab ${tab==='memory'?'active':''}" data-tab="memory">Memory</button><button class="tab ${tab==='model'?'active':''}" data-tab="model">Model</button><button class="tab ${tab==='data'?'active':''}" data-tab="data">Data</button></div><div class="pane ${tab==='companion'?'active':''}" data-pane="companion"><label class="field-label">Companion name</label><input class="field" id="cName" value="${esc(c.name)}"><div class="row2"><div><label class="field-label">Gender</label><select class="field" id="cGender"><option ${c.gender==='Female'?'selected':''}>Female</option><option ${c.gender==='Male'?'selected':''}>Male</option></select></div><div><label class="field-label">Profile</label><select class="field" id="cAge"><option ${c.age==='16+'?'selected':''}>16+</option><option ${c.age==='18+'?'selected':''}>18+</option></select></div></div><label class="field-label">Role / relationship</label><select class="field" id="cRole">${roleOpts}</select><input class="field role-custom ${c.role==='Custom role'?'show':''}" id="cCustomRole" value="${esc(c.customRole||'')}" placeholder="Describe the role or relationship"><div class="field-help">Choose a role or define your own. The companion follows the selected profile and the model's capabilities.</div><label class="field-label">Tone</label><select class="field" id="cTone">${['Natural','Casual','Warm','Playful','Focused','Gentle','Energetic','Dry humor'].map(x=>`<option ${c.tone===x?'selected':''}>${x}</option>`).join('')}</select><div class="section-divider"></div><h3 class="section-title">About you</h3><label class="field-label">Your name</label><input class="field" id="uName" value="${esc(c.userName||'')}" placeholder="Your name"><div class="row2"><div><label class="field-label">Gender</label><select class="field" id="uGender"><option>Prefer not to say</option><option ${c.userGender==='Female'?'selected':''}>Female</option><option ${c.userGender==='Male'?'selected':''}>Male</option><option ${c.userGender==='Non-binary'?'selected':''}>Non-binary</option></select></div><div><label class="field-label">Pronouns</label><select class="field" id="uPronouns"><option ${c.pronouns==='she/her'?'selected':''}>she/her</option><option ${c.pronouns==='he/him'?'selected':''}>he/him</option><option ${c.pronouns==='they/them'?'selected':''}>they/them</option></select></div></div><div class="row2"><div><label class="field-label">Nickname</label><input class="field" id="uNickname" value="${esc(c.nickname||'')}" placeholder="Optional"></div><div><label class="field-label">Address me as</label><select class="field" id="uAddress"><option value="name" ${c.addressMode==='name'?'selected':''}>Name</option><option value="nickname" ${c.addressMode==='nickname'?'selected':''}>Nickname</option><option value="none" ${c.addressMode==='none'?'selected':''}>No name</option></select></div></div><div class="field-help">These details tell the companion who it is talking to. Pronouns are used when referring to you.</div>${[['warmth','Warmth'],['humor','Humor'],['energy','Energy'],['formality','Formality'],['proactivity','Proactivity'],['emoji','Emoji']].map(([k,l])=>`<div class="range-row"><input type="range" id="r_${k}" min="0" max="100" value="${c[k]}"><span>${l} <b>${c[k]}</b></span></div>`).join('')}<label class="field-label">Preferred words & phrases</label><div class="word-list" id="words">${(c.words||[]).map((w,i)=>`<span class="word">${esc(w.w)} <small>${esc(w.f)}</small><button data-rm-word="${i}" title="Remove phrase">×</button></span>`).join('')}</div><div class="add-row"><input class="field" id="wordInput" placeholder="e.g. bro"><select class="field" id="wordFreq"><option>rare</option><option selected>occasional</option><option>frequent</option></select><button class="mini-btn" id="addWord">Add</button></div><label class="field-label">Avoid phrases</label><div class="word-list" id="avoids">${(c.avoid||[]).map((w,i)=>`<span class="word">${esc(w)}<button data-rm-avoid="${i}" title="Remove phrase">×</button></span>`).join('')}</div><div class="add-row"><input class="field" id="avoidInput" placeholder="Phrase to avoid"><button class="mini-btn" id="addAvoid">Add</button></div><button class="primary" id="saveComp">Save changes</button><p class="note">16+ and 18+ are profile labels. A 16+ profile remains age-appropriate; an 18+ profile allows a mature conversational style subject to the model's capabilities and applicable safety boundaries.</p></div><div class="pane ${tab==='memory'?'active':''}" data-pane="memory"><label class="field-label">What Luma remembers about you</label><p class="note">Memories stay in this browser. Luma can use them when relevant without sending them to a server.</p><div class="memory-list">${memories.length?memories.map(m=>`<div class="memory-card"><strong>${esc(m.text)}</strong><small>${esc(m.source||'saved')} · ${new Date(m.created||Date.now()).toLocaleDateString()}</small><button data-rm-memory="${esc(m.id)}">Forget</button></div>`).join(''):'<div class="field-help">No memories saved yet. Use ☆ on a user message or add one below.</div>'}</div><label class="field-label">Add a memory</label><textarea class="field" id="memoryInput" rows="3" placeholder="e.g. I prefer concise explanations."></textarea><button class="primary" id="addMemory">Remember this</button><p class="note">Luma also saves a few obvious self-statements automatically, such as “I like…” or “I’m working on…”.</p></div><div class="pane ${tab==='model'?'active':''}" data-pane="model"><label class="field-label">Smart recommendation</label><div class="setup-model"><strong>${esc(modelRec.label)}</strong><span>${esc(modelRec.desc)} · ${esc(modelCompatibility(modelRec,S.device||{}).reason)}${S.modelBench?.ms?` · GPU test ${S.modelBench.ms.toFixed(0)} ms`:''}</span></div><button class="mini-btn" id="benchmarkGpu" style="width:100%;margin-top:10px">${S.modelBench?'Run GPU test again':'Test this device'}</button><p class="note">Luma checks WebGPU features and limits, the model's own VRAM/buffer requirements, device memory hints and an optional short GPU workload. It never treats browser-reported RAM as exact VRAM.</p><label class="field-label">Local model</label><select class="field" id="settingsModel">${MODELS.map(m=>{const c=modelCompatibility(m,S.device||{});const tag=c.status==='unavailable'?' — Unavailable':c.status==='heavy'?' — Heavy':c.status==='possible'?' — Possible':m.id===modelRec.id?' — Recommended':'';return `<option value="${esc(m.id)}" ${m.id===S.model?'selected':''} ${c.status==='unavailable'?'disabled':''}>${esc(m.label)} — ${esc(m.desc)}${tag}</option>`}).join('')}</select><button class="primary" id="loadModel">Download / load selected model</button><p class="note">The catalogue comes from WebLLM's current <code>prebuiltAppConfig.model_list</code>. WebLLM is the browser inference engine; the selected entry is the actual local LLM model and its MLC/WebGPU runtime.</p><label class="field-label">Cached models</label><div class="model-catalog" id="cacheList">${MODELS.map(m=>`<div class="cache-row" data-cache-id="${esc(m.id)}"><div class="cache-info"><strong>${esc(m.label)}</strong><small>${esc(m.size)}</small></div><span class="cache-state">Checking…</span></div>`).join('')}</div><p class="note">WebGPU: <b>${navigator.gpu?'Available':'Unavailable'}</b> · CPU cores: <b>${navigator.hardwareConcurrency||'unknown'}</b> · Memory hint: <b>${navigator.deviceMemory||'unknown'} GB</b></p></div><div class="pane ${tab==='data'?'active':''}" data-pane="data"><button class="primary" id="exportData">Export conversations, profile & memory</button><button class="mini-btn" id="importData" style="width:100%;margin-top:9px">Import backup</button><p class="note">Everything is stored locally in this browser. Export a backup before clearing site data.</p><button class="mini-btn danger" id="clearData" style="width:100%;margin-top:22px">Clear all local data</button></div>`}
function openSettings(tab='companion'){closePanels();$('settingsSheet').innerHTML=settingsHTML(tab);$('backdrop').classList.add('show');bindSettings()}
function bindSettings(){
 $('closeSettings').onclick=closePanels;
 document.querySelectorAll('[data-tab]').forEach(t=>t.onclick=async()=>{if(t.dataset.tab==='model')await hydrateModels();$('settingsSheet').innerHTML=settingsHTML(t.dataset.tab);bindSettings()});
 if(document.querySelector('[data-pane=\"model\"]'))refreshCacheStates();
 document.querySelector('#cRole')?.addEventListener('change',e=>{$('cCustomRole').classList.toggle('show',e.target.value==='Custom role')});
 ['warmth','humor','energy','formality','proactivity','emoji'].forEach(k=>{$('r_'+k).oninput=e=>e.target.parentElement.querySelector('b').textContent=e.target.value});
 $('addWord')?.addEventListener('click',()=>{const v=$('wordInput').value.trim();if(v){S.comp.words.push({w:v,f:$('wordFreq').value});save();openSettings('companion')}});
 $('addAvoid')?.addEventListener('click',()=>{const v=$('avoidInput').value.trim();if(v){S.comp.avoid.push(v);save();openSettings('companion')}});
 document.querySelectorAll('[data-rm-word]').forEach(b=>b.onclick=()=>{S.comp.words.splice(+b.dataset.rmWord,1);save();openSettings('companion')});
 document.querySelectorAll('[data-rm-avoid]').forEach(b=>b.onclick=()=>{S.comp.avoid.splice(+b.dataset.rmAvoid,1);save();openSettings('companion')});
 document.querySelectorAll('[data-rm-memory]').forEach(b=>b.onclick=()=>forgetMemory(b.dataset.rmMemory));
 $('addMemory')?.addEventListener('click',()=>{const v=$('memoryInput').value.trim();if(v){addMemory(v,'manual');openSettings('memory')}});
 $('saveComp')?.addEventListener('click',()=>{S.comp.name=$('cName').value.trim()||'Emma';S.comp.gender=$('cGender').value;S.comp.age=$('cAge').value;S.comp.role=$('cRole').value;S.comp.customRole=$('cCustomRole').value.trim();S.comp.tone=$('cTone').value;S.comp.userName=$('uName').value.trim();S.comp.userGender=$('uGender').value;S.comp.pronouns=$('uPronouns').value;S.comp.nickname=$('uNickname').value.trim();S.comp.addressMode=$('uAddress').value;for(const k of ['warmth','humor','energy','formality','proactivity','emoji'])S.comp[k]=+$('r_'+k).value;save();$('sideName').textContent=S.comp.name;$('sideAvatar').textContent=initials();closePanels();renderMessages()});
 $('loadModel')?.addEventListener('click',async()=>{const id=$('settingsModel').value;S.model=id;save();closePanels();await loadEngine(id)});
 $('benchmarkGpu')?.addEventListener('click',async()=>{const b=$('benchmarkGpu');b.disabled=true;b.textContent='Testing GPU…';const r=await benchmarkGPU();if(r){b.textContent=`GPU test: ${r.ms.toFixed(0)} ms · Run again`}else{b.textContent='GPU test unavailable'};openSettings('model')});
 $('exportData')?.addEventListener('click',()=>{const blob=new Blob([JSON.stringify({version:5,app:'Luma',comp:S.comp,chats:S.chats,model:S.model},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='luma-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});
 $('importData')?.addEventListener('click',()=>$('fileInput').click());
 $('clearData')?.addEventListener('click',()=>{if(confirm('Clear all conversations, memories and companion settings?')){localStorage.removeItem('luma_companion_v4');localStorage.removeItem('krono_companion_v3');localStorage.removeItem('luma_model_ready');location.reload()}});
}
$('newChat').onclick=()=>{S.active=null;ensureChat();save();renderChats();renderMessages();$('input').focus();closeSidebar()};$('companionBtn').onclick=()=>openSettings('companion');$('settingsBtn').onclick=()=>openSettings('companion');$('backdrop').onclick=e=>{if(e.target.id==='backdrop')closePanels()};$('menuBtn').onclick=()=>$('sidebar').classList.toggle('open');$('collapseSide').onclick=()=>{$('sidebar').classList.remove('open')};$('sidebarBackdrop').onclick=()=>{$('sidebar').classList.remove('open')};document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePanels();$('sidebar').classList.remove('open')}});
let recognition=null;let recognizing=false;function speechCtor(){return window.SpeechRecognition||window.webkitSpeechRecognition||null}
async function startVoice(){
 const C=speechCtor();if(!C){alert('Voice input is not supported by this browser. Try current Chrome or Edge.');return}
 if(recognizing){try{recognition.stop()}catch{}return}
 recognition=new C();recognition.lang='en-IN';recognition.interimResults=true;recognition.continuous=false;recognition.maxAlternatives=1;
 if('processLocally' in recognition)recognition.processLocally=true;
 recognition.onstart=()=>{recognizing=true;$('micBtn').classList.add('mic','active');setStatus('Listening…')};
 recognition.onresult=e=>{let text='';for(let i=e.resultIndex;i<e.results.length;i++)text+=e.results[i][0].transcript;if(text){$('input').value=text;resize()}};
 recognition.onerror=e=>{if(e.error==='language-not-supported'||e.error==='service-not-allowed'){try{recognition.processLocally=false;recognition.start();return}catch{}}if(e.error!=='aborted')alert('Voice input: '+e.error)};
 recognition.onend=()=>{recognizing=false;$('micBtn').classList.remove('active');setStatus(navigator.gpu?'Local AI ready':'WebGPU unavailable',!!navigator.gpu)};
 try{
   if(C.available&&'processLocally' in recognition){const state=await C.available({langs:['en-IN'],processLocally:true,quality:'dictation'}).catch(()=>null);if(state==='downloadable'&&C.install)await C.install({langs:['en-IN'],processLocally:true,quality:'dictation'});if(state==='unavailable')recognition.processLocally=false}
   recognition.start();
 }catch(e){alert('Could not start microphone: '+(e?.message||e))}
}
$('micBtn').onclick=startVoice;
function speakMsg(i){const c=current(),text=c?.messages[i]?.content;if(!text||!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.replace(/```[\s\S]*?```/g,'code block'));u.lang='en-IN';u.rate=.98;speechSynthesis.speak(u)}
$('input').oninput=resize;$('input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send(e.target.value)}};$('send').onclick=()=>send($('input').value);$('fileInput').onchange=async()=>{const f=$('fileInput').files[0];if(!f)return;try{const x=JSON.parse(await f.text());if(x.comp)S.comp={...defaults,...x.comp};if(Array.isArray(x.chats))S.chats=x.chats;if(x.model)S.model=x.model;S.active=S.chats[0]?.id||null;save();renderChats();renderMessages();$('sideName').textContent=S.comp.name;$('sideAvatar').textContent=initials()}catch(e){alert('Could not import backup: '+e.message)}$('fileInput').value=''};$('search').oninput=e=>{S.search=e.target.value;renderChats()};
$('chatTitlebar').textContent='New chat';$('sideName').textContent=S.comp.name;$('sideAvatar').textContent=initials();ensureChat();renderChats();renderMessages();(async()=>{await detectDevice();await hydrateModels();if(navigator.gpu&&!S.modelBench)await benchmarkGPU();if(!S.model||!MODELS.some(m=>m.id===S.model)||modelCompatibility(MODELS.find(m=>m.id===S.model),S.device||{}).status==='unavailable'){S.model=deviceModel(S.device||{}).id;save()}if(!navigator.gpu){setStatus('WebGPU unavailable');return}const cached=await cacheState(S.model);if(cached){localStorage.setItem('luma_model_ready','1');setStatus('Local AI ready to load',true)}else{localStorage.removeItem('luma_model_ready');setTimeout(openSetup,450)}})();
</script>
